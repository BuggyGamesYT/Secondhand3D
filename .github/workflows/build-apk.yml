name: Build APK

on:
  push:
    tags: ['v*']          # push a tag like v1.1 -> build, sign, publish a release
  workflow_dispatch:      # "Run workflow" button -> build only, APK as a download

permissions:
  contents: write

env:
  GODOT_VERSION: 4.5.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.0" "platforms;android-35" > /dev/null

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Download Godot (headless editor + Android export templates)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          V="${GODOT_VERSION}-stable"
          mkdir -p ~/godot-cache/templates && cd ~/godot-cache
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_linux.x86_64.zip"
          unzip -o -q godot.zip && mv "Godot_v${V}_linux.x86_64" godot && rm godot.zip
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_export_templates.tpz"
          unzip -o -q -j templates.tpz 'templates/android_release.apk' 'templates/android_debug.apk' 'templates/version.txt' -d templates
          rm templates.tpz
          ls -la ~/godot-cache ~/godot-cache/templates

      - name: Set up Godot
        run: |
          set -e
          chmod +x ~/godot-cache/godot
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$TPL" && cp ~/godot-cache/templates/* "$TPL/"
          keytool -genkeypair -keystore ~/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" > /dev/null 2>&1
          MINOR=$(echo "$GODOT_VERSION" | cut -d. -f1,2)
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-$MINOR.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sed -i 's/^          //' ~/.config/godot/editor_settings-$MINOR.tres
          cat ~/.config/godot/editor_settings-$MINOR.tres

      - name: Prepare signing key
        env:
          KEY_PASS: ${{ secrets.SECONDHAND3D_KEY_PASS }}
        run: |
          set -e
          mkdir -p build
          if [ -n "$KEY_PASS" ]; then
            printf '%s' "$KEY_PASS" > build/ks.pass
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/signing/release.keystore.enc -out build/release.keystore -pass file:build/ks.pass
            rm -f build/ks.pass
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=secondhand3d" >> "$GITHUB_ENV"
            echo "::add-mask::$KEY_PASS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::SECONDHAND3D_KEY_PASS secret is missing, so a release can't be signed with the real key."; exit 1
            fi
            echo "::warning::No SECONDHAND3D_KEY_PASS secret: signing with a throwaway test key (won't update over an installed copy)."
            keytool -genkeypair -keystore build/release.keystore -storetype PKCS12 -alias test -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass testtest -keypass testtest -dname "CN=Test" > /dev/null 2>&1
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=test" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=testtest" >> "$GITHUB_ENV"
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$PWD/build/release.keystore" >> "$GITHUB_ENV"

      - name: Import project (Compatibility / GLES3)
        working-directory: godot
        run: |
          ~/godot-cache/godot --headless --import 2>&1 | tail -n 20 || true
          ls .godot | head

      - name: Export GL (Compatibility) APK
        working-directory: godot
        run: |
          set -e
          ~/godot-cache/godot --headless --export-release "Android" ../build/Secondhand3D-gl.apk 2>&1 | tee ../build/export-gl.log
          test -s ../build/Secondhand3D-gl.apk || { echo "::error::GL export produced no APK"; exit 1; }
          if grep -q "SHADER ERROR\|SCRIPT ERROR\|Parse Error" ../build/export-gl.log; then echo "::error::errors in GL export"; exit 1; fi

      - name: Switch project to the Mobile (Vulkan) renderer
        working-directory: godot
        run: |
          set -e
          sed -i 's/^renderer\/rendering_method=.*/renderer\/rendering_method="mobile"/; s/^renderer\/rendering_method.mobile=.*/renderer\/rendering_method.mobile="mobile"/' project.godot
          sed -i 's/"GL Compatibility")/"Mobile")/' project.godot
          # keep the SPIR-V shader cache on Vulkan (pipeline cache stays off: it crashes the Pixel 10 PowerVR driver)
          sed -i '/^shader_compiler\/shader_cache\/enabled.android=/d' project.godot
          grep -n "rendering_method\|config/features\|cache" project.godot

      - name: Import project (Mobile / Vulkan)
        working-directory: godot
        run: |
          ~/godot-cache/godot --headless --import 2>&1 | tail -n 20 || true

      - name: Export VK (Mobile) APK
        working-directory: godot
        run: |
          set -e
          ~/godot-cache/godot --headless --export-release "Android" ../build/Secondhand3D-vk.apk 2>&1 | tee ../build/export-vk.log
          test -s ../build/Secondhand3D-vk.apk || { echo "::error::VK export produced no APK"; exit 1; }
          if grep -q "SHADER ERROR\|SCRIPT ERROR\|Parse Error" ../build/export-vk.log; then echo "::error::errors in VK export"; exit 1; fi
          git checkout project.godot

      - name: Verify and name the APKs
        run: |
          set -e
          rm -f build/release.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          for v in gl vk; do
            echo "== $v"
            "$BT/apksigner" verify --print-certs "build/Secondhand3D-$v.apk" | head -n 5
            "$BT/aapt2" dump badging "build/Secondhand3D-$v.apk" | head -n 3
            "$BT/aapt2" dump badging "build/Secondhand3D-$v.apk" | grep -i "vulkan\|opengl\|orientation" || true
          done
          # the default download: GL (Compatibility) is the safer pick on the Pixel 10's PowerVR GPU
          cp build/Secondhand3D-gl.apk build/Secondhand3D.apk
          VER=$(grep -o '^version/name="[^"]*"' godot/export_presets.cfg | cut -d'"' -f2)
          cp build/Secondhand3D-gl.apk "build/Secondhand3D-v$VER-gl.apk"
          cp build/Secondhand3D-vk.apk "build/Secondhand3D-v$VER-vk.apk"
          echo "VER=$VER" >> "$GITHUB_ENV"
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: Secondhand3D-gl.apk
          path: build/Secondhand3D-gl.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Secondhand3D-vk.apk
          path: build/Secondhand3D-vk.apk

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Secondhand3D.apk
            build/Secondhand3D-gl.apk
            build/Secondhand3D-vk.apk
          generate_release_notes: true
